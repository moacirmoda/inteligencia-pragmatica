name: Propor uma melhoria
description: Sugira uma evolução genérica do método ou da implementação.
title: "[Proposta]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Que necessidade genérica esta proposta resolve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Descreva comportamento, artefatos e validações esperados.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
