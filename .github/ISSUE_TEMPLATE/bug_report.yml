name: Relatar um bug
description: Informe um comportamento reproduzível da CLI, schemas ou validações.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: O que aconteceu e o que você esperava?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reprodução mínima
      description: Remova dados pessoais e forneça comandos ou um YAML sanitizado.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Ambiente
      description: Sistema operacional e versão do Python.
    validations:
      required: true
